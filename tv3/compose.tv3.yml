services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: HOST://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: HOST://127.0.0.1:19092,INTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - tv3_kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
  postgres:
    image: postgres:15
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_USER: tv3_demo
      POSTGRES_PASSWORD: tv3_local_only
      POSTGRES_DB: nids_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tv3_demo -d nids_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - tv3_db:/var/lib/postgresql/data
volumes:
  tv3_db:
  tv3_kafka:

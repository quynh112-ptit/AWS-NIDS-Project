# ============================================================
# Nginx reverse proxy cho Dashboard (8501) và Web QR (8502)
# Điều phối lưu lượng ở tầng ứng dụng: 1 cổng 80/443 duy nhất ra Internet,
# giới hạn tốc độ request (chống flood vào web), WebSocket cho Streamlit.
#   sudo apt install -y nginx
#   sudo cp deploy/nginx/nids.conf /etc/nginx/sites-available/nids
#   sudo ln -sf /etc/nginx/sites-available/nids /etc/nginx/sites-enabled/nids
#   sudo nginx -t && sudo systemctl reload nginx
# Khi đã dùng Nginx, có thể đóng 8501/8502 trong Security Group và chỉ mở 80 (Dashboard) và 8080 (Web QR).
# Mở rộng nhiều EC2: thêm IP máy chủ vào upstream (hoặc thay bằng AWS ALB + Target Group).
# ============================================================
limit_req_zone $binary_remote_addr zone=nids_web:10m rate=10r/s;

upstream nids_dashboard {
    server 127.0.0.1:8501 max_fails=3 fail_timeout=10s;
    # server 10.0.1.12:8501;   # EC2 thứ 2 (round-robin) khi mở rộng
}

upstream nids_qr {
    server 127.0.0.1:8502 max_fails=3 fail_timeout=10s;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    location / {
        limit_req zone=nids_web burst=20 nodelay;
        proxy_pass http://nids_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    location = /healthz {
        proxy_pass http://nids_dashboard/_stcore/health;
    }
}

# Web QR qua cổng 8080 (Streamlit cần chạy ở đường dẫn gốc nên tách server block riêng)
server {
    listen 8080;
    server_name _;

    location / {
        limit_req zone=nids_web burst=10 nodelay;
        proxy_pass http://nids_qr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
